<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Регистрация на волейбол 19.12.2025</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #registerForm { display: none; margin-top: 15px; }
    #participants { margin-top: 20px; }
    .admin-panel { display: none; margin-top: 20px; padding: 15px; border: 1px solid #ccc; }
    .admin-btn { padding: 6px 12px; margin-top: 5px; }
    #lockIcon {
        position: absolute;
        top: 15px;
        right: 20px;
        cursor: pointer;
        font-size: 20px;
    }
    #adminLogin {
        display: none;
        position: absolute;
        top: 45px;
        right: 20px;
        background: #fff;
        padding: 10px;
        border: 1px solid #ccc;
    }
    .edit-input {
        width: 200px;
        margin-right: 5px;
    }
    .participant-item {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 5px;
    }
    .small-btn {
        padding: 2px 6px;
        font-size: 12px;
    }
</style>
</head>
<body>

<div id="lockIcon">🔒</div>

}
<div id="adminLogin">
    <input type="password" id="adminPass" placeholder="">
    <button id="checkPassBtn">Войти</button>
</div>
    
<style>
    /* Уменьшение иконки замка в 3 раза */
    #lockIcon {
        font-size: 8px; /* уменьшенная иконка */
        cursor: pointer;
        position: absolute;
        top: 10px;
        right: 10px;
    }

    /* Форма администратора */
    #adminLogin {
        display: none;
        position: absolute;
        top: 30px;
        right: 10px;
        background: #fff;
        padding: 5px;
        border: 1px solid #ccc;
        z-index: 1000;
    }

    #adminLogin input {
        width: 100px;
        margin-right: 5px;
    }

    #adminLogin button {
        padding: 2px 6px;
    }
</style>
<h2>Регистрация на мероприятие</h2>

<div id="placeInfo"></div>

<button id="openRegBtn">Регистрация</button>

<div id="registerForm">
    <h3>Введите данные</h3>
    <input type="text" id="firstName" placeholder="Имя"><br><br>
    <input type="text" id="lastName" placeholder="Фамилия"><br><br>
    <button id="confirmBtn">Подтвердить</button>
</div>

<div id="adminPanel" class="admin-panel">
    <h3>Панель администратора</h3>

    <h4>Добавить нового участника вручную</h4>
    <input type="text" id="adminAddName" placeholder="Имя Фамилия" class="edit-input">
    <button id="adminAddBtn" class="small-btn">Добавить</button>

    <h4 style="margin-top:20px;">Редактировать или удалить участников</h4>
    <div id="adminParticipants"></div>

    <h4 style="margin-top:20px;">Прочее</h4>
    <button id="resetBtn" class="admin-btn">Обнулить список</button>

    <br><br>
    <!-- Новая кнопка подтверждения изменений -->
    <button id="applyChangesBtn" class="admin-btn">Подтвердить изменения</button>
</div>

<div id="participants">
    <h3>Список участников:</h3>
    <ul id="participantList"></ul>
</div>

<script>
// Настройки
let maxSeats = 12;
let participants = [];

// Элементы интерфейса
const placeInfo = document.getElementById("placeInfo");
const openRegBtn = document.getElementById("openRegBtn");
const registerForm = document.getElementById("registerForm");
const confirmBtn = document.getElementById("confirmBtn");
const participantList = document.getElementById("participantList");

const lockIcon = document.getElementById("lockIcon");
const adminLogin = document.getElementById("adminLogin");
const checkPassBtn = document.getElementById("checkPassBtn");
const adminPanel = document.getElementById("adminPanel");
const adminParticipants = document.getElementById("adminParticipants");
const applyChangesBtn = document.getElementById("applyChangesBtn");

const adminAddName = document.getElementById("adminAddName");
const adminAddBtn = document.getElementById("adminAddBtn");

const resetBtn = document.getElementById("resetBtn");


// **************** LOCAL STORAGE ****************
function loadFromStorage() {
    const saved = localStorage.getItem("participantsList");
    if (saved) {
        participants = JSON.parse(saved);
    }
}

function saveToStorage() {
    localStorage.setItem("participantsList", JSON.stringify(participants));
}


// **************** ОБНОВЛЕНИЕ UI ****************
function updatePlaces() {
    const availableSeats = maxSeats - participants.length;
    placeInfo.textContent = `${availableSeats}/${maxSeats} мест доступно`;

    openRegBtn.disabled = availableSeats <= 0;
    if (availableSeats <= 0) {
        registerForm.style.display = "none";
    }
}

function updateParticipants() {
    participantList.innerHTML = "";
    participants.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p;
        participantList.appendChild(li);
    });
}

function updateAdminParticipants() {
    adminParticipants.innerHTML = "";

    participants.forEach((p, index) => {
        const div = document.createElement("div");
        div.className = "participant-item";

        const input = document.createElement("input");
        input.type = "text";
        input.value = p;
        input.className = "edit-input";

        input.oninput = () => {
            participants[index] = input.value;
        };

        const delBtn = document.createElement("button");
        delBtn.textContent = "Удалить";
        delBtn.className = "small-btn";
        delBtn.onclick = () => {
            participants.splice(index, 1);
            refreshAll();
        };

        div.appendChild(input);
        div.appendChild(delBtn);
        adminParticipants.appendChild(div);
    });
}

function refreshAll() {
    updatePlaces();
    updateParticipants();
    updateAdminParticipants();
    saveToStorage();
}


// **************** ФОРМА РЕГИСТРАЦИИ ****************
openRegBtn.addEventListener("click", () => {
    registerForm.style.display = "block";
});

confirmBtn.addEventListener("click", () => {
    const first = document.getElementById("firstName").value.trim();
    const last = document.getElementById("lastName").value.trim();

    if (!first || !last) {
        alert("Введите имя и фамилию.");
        return;
    }

    if (participants.length >= maxSeats) return;

    participants.push(`${first} ${last}`);

    document.getElementById("firstName").value = "";
    document.getElementById("lastName").value = "";
    registerForm.style.display = "none";

    refreshAll();
});


// **************** АДМИНИСТРАТОР ****************
lockIcon.addEventListener("click", () => {
    adminLogin.style.display =
        adminLogin.style.display === "block" ? "none" : "block";
});

// Скрытие формы пароля при клике в любое место
document.addEventListener("click", function(event) {
    const isInsideLogin = adminLogin.contains(event.target);
    const isLock = lockIcon.contains(event.target);

    if (!isInsideLogin && !isLock) {
        adminLogin.style.display = "none";
    }
});

checkPassBtn.addEventListener("click", () => {
    const pass = document.getElementById("adminPass").value;

    if (pass === "Active") {
        adminLogin.style.display = "none";
        adminPanel.style.display = "block";
        refreshAll();
    } else {
        alert("Неверный пароль.");
    }
});

// Добавление участника вручную
adminAddBtn.addEventListener("click", () => {
    const name = adminAddName.value.trim();
    if (!name) return;

    if (participants.length >= maxSeats) {
        alert("Нет свободных мест.");
        return;
    }

    participants.push(name);
    adminAddName.value = "";
    refreshAll();
});

// Полный сброс
resetBtn.addEventListener("click", () => {
    if (!confirm("Вы уверены, что хотите обнулить список?")) return;

    participants = [];
    refreshAll();
});


// *************** НОВАЯ КНОПКА "ПОДТВЕРДИТЬ ИЗМЕНЕНИЯ" ***************
applyChangesBtn.addEventListener("click", () => {
    saveToStorage();      // сохраняем
    adminPanel.style.display = "none"; // закрываем панель
    refreshAll();         // обновляем интерфейс
});


// **************** ИНИЦИАЛИЗАЦИЯ ****************
loadFromStorage();
refreshAll();
</script>

</body>
</html>
