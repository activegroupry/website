<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата турнира</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-lg rounded-2xl p-8 max-w-md w-full text-center">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">Оплата участия в турнире</h1>
    <p class="text-gray-600 mb-6">
      Пожалуйста, переведите взнос за участие по следующим реквизитам:
    </p>

    <div class="bg-gray-100 rounded-xl p-4 mb-4 text-left">
      <p class="text-gray-800 font-semibold">Получатель:</p>
      <p class="text-gray-700 mb-2">Active Group Ry</p>

      <p class="text-gray-800 font-semibold">IBAN:</p>
      <p class="text-gray-700 mb-2 select-all">FI29 1400 3000 1306 07</p>

      <p class="text-gray-800 font-semibold">Reference:</p>
      <p class="text-gray-700 select-all">5238</p>
    </div>

    <button 
      onclick="copyToClipboard()" 
      class="bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 transition">
      📋 Скопировать реквизиты
    </button>

    <p id="copied" class="text-green-600 mt-3 hidden">Реквизиты скопированы!</p>

    <div class="mt-6 text-gray-600 text-sm">
      После оплаты, пожалуйста, отправьте подтверждение на email<br>
      <a href="mailto:info@activegroup.fi" class="text-blue-600 underline">info@activegroup.fi</a>
    </div>
  </div>

  <script>
    function copyToClipboard() {
      const text = `Active Group Ry
IBAN: FI29 1400 3000 1306 07
Reference: 5238`;
      navigator.clipboard.writeText(text).then(() => {
        document.getElementById('copied').classList.remove('hidden');
        setTimeout(() => {
          document.getElementById('copied').classList.add('hidden');
        }, 2000);
      });
    }
  </script>

</body>
</html>
